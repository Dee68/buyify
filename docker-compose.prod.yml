version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - buyify_net

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/buyify-web:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media    # if you use local media
    expose:
      - "8000"
    networks:
      - buyify_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/static:ro
      - media_data:/app/media:ro
      - ./nginx/certs:/etc/letsencrypt:ro    # if using certbot-managed certs on host
    depends_on:
      web:
        condition: service_started
    networks:
      - buyify_net

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  buyify_net:
    driver: bridge
